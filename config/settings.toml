[agent]
model = "claude-opus-4-6"
max_turns = 30
max_budget_usd = 2.0

[scheduler]
# How often (in minutes) the agent runs its maintenance scan
interval_minutes = 60
# Run immediately on startup before first scheduled interval
run_on_startup = true

[scanner]
# File extensions to include in analysis
include_extensions = [".py", ".ts", ".js", ".md", ".yaml", ".yml", ".toml", ".json"]
# Directories to always skip
exclude_dirs = [".git", "__pycache__", "node_modules", ".venv", "venv", "dist", "build", ".next"]
# Max file size to read (in KB)
max_file_size_kb = 500

[prioritizer]
# Tasks with impact >= this threshold are executed autonomously
auto_execute_min_impact = 3
# Tasks with risk >= this threshold require human review
human_review_min_risk = 8
# Max tasks to execute per maintenance cycle
max_tasks_per_cycle = 5

[git]
# Whether to auto-commit changes made by the agent
auto_commit = true
# Branch prefix for agent-created fix branches
branch_prefix = "agent/maintenance"
# Commit author
author_name = "Autonomous Maintenance Agent"
author_email = "agent@maintenance.bot"

[logging]
level = "INFO"
log_file = "logs/agent.log"
audit_file = "logs/audit.log"

[reporting]
# Directory where Terrance's morning reports are saved
output_dir = "reports"
# How many hours back to look when building the morning report
lookback_hours = 24

[github]
# Max number of starred repos to process per run
max_stars = 50
# Shallow clone depth (1 = latest commit only, faster)
clone_depth = 1
# Skip repos the user has forked
skip_forks = true
# Skip archived repos
skip_archived = true
# Only scan repos owned by the authenticated user (not other people's repos)
only_owned = false
# Actually apply and commit fixes to starred repos (requires push access)
# Set to false for read-only scanning and reporting
execute_tasks = false
# Base directory for temporary clones (empty = system temp dir)
temp_dir = ""
